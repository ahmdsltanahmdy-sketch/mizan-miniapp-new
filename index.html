<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پایگاه خبری میزان | مینی‌اپ حقوقی و قضایی</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap');
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between shrink-0 shadow-md">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="bg-blue-600 p-2 rounded-xl text-white font-bold text-lg shadow-lg shadow-blue-500/20">⚖️</div>
            <div>
                <h1 class="font-bold text-base text-slate-100">خبرگزاری میزان</h1>
                <p class="text-xs text-slate-400">مرجع حقوقی و قضایی کشور</p>
            </div>
        </div>
        <div id="user-badge" class="bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-xs text-slate-300">
            مهمان
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4 pb-24">
        
        <!-- Loading State -->
        <div id="loading-view" class="flex flex-col items-center justify-center py-20 space-y-3">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500"></div>
            <p class="text-sm text-slate-400">در حال دریافت آخرین اخبار و اطلاعات حقوقی...</p>
        </div>

        <!-- App Container (Hidden initially) -->
        <div id="app-container" class="hidden space-y-4">
            
            <!-- Tabs Navigation -->
            <div id="tabs-container" class="flex space-x-2 space-x-reverse overflow-x-auto pb-2 custom-scrollbar">
                <!-- Dynamically populated tabs -->
            </div>

            <!-- News List Section -->
            <section id="news-section" class="space-y-3">
                <h2 class="text-sm font-bold text-slate-300 px-1">آخرین گزارش‌ها و اخبار</h2>
                <div id="news-list" class="space-y-3">
                    <!-- Dynamically populated news -->
                </div>
            </section>

            <!-- AI Assistant Section -->
            <section class="bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/60 rounded-2xl p-4 shadow-xl">
                <div class="flex items-center space-x-2 space-x-reverse mb-3">
                    <span class="text-xl">🤖</span>
                    <h2 class="font-bold text-sm text-slate-200">مشاور هوشمند حقوقی میزان</h2>
                </div>
                <div class="space-y-3">
                    <textarea id="ai-query-input" rows="3" placeholder="سوال حقوقی خود را بپرسید (مثلاً: شرایط مطالبه مهریه چیست؟)..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500 custom-scrollbar resize-none"></textarea>
                    <button onclick="askAI()" id="ai-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-lg shadow-blue-600/30 flex items-center justify-center space-x-2 space-x-reverse">
                        <span>ارسال به وکیل هوشمند</span>
                    </button>
                    <div id="ai-response-box" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-300 leading-relaxed mt-2"></div>
                </div>
            </section>

            <!-- Legal Links Section -->
            <section class="space-y-2">
                <h2 class="text-sm font-bold text-slate-300 px-1">سامانه‌های پرکاربرد قضایی</h2>
                <div id="legal-systems-list" class="grid grid-cols-2 gap-2">
                    <!-- Dynamically populated -->
                </div>
            </section>

        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="absolute bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 p-2 flex justify-around items-center shrink-0 z-50">
        <button onclick="switchView('news')" class="flex flex-col items-center text-blue-500 space-y-1 text-xs">
            <span class="text-lg">📰</span>
            <span>اخبار و مینی‌اپ</span>
        </button>
        <button onclick="switchView('bookmarks')" class="flex flex-col items-center text-slate-400 hover:text-slate-200 space-y-1 text-xs">
            <span class="text-lg">🔖</span>
            <span>نشان‌شده‌ها</span>
        </button>
        <button onclick="switchView('faq')" class="flex flex-col items-center text-slate-400 hover:text-slate-200 space-y-1 text-xs">
            <span class="text-lg">⚖️</span>
            <span>پرسش‌های حقوقی</span>
        </button>
    </nav>

    <!-- Single News / Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex flex-col justify-end">
        <div class="bg-slate-900 border-t border-slate-800 rounded-t-3xl p-5 max-h-[85vh] flex flex-col space-y-4 overflow-hidden">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="font-bold text-sm text-slate-100 line-clamp-1">جزئیات خبر</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>
            <div id="modal-body" class="overflow-y-auto custom-scrollbar space-y-4 text-sm text-slate-300">
                <p id="modal-summary" class="leading-relaxed"></p>
                <div id="ai-summary-container" class="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-blue-400">✨ خلاصه‌سازی هوش مصنوعی</span>
                        <button onclick="summarizeCurrentNews()" id="summarize-btn" class="bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 text-xs px-3 py-1 rounded-lg transition">خلاصه کن</button>
                    </div>
                    <div id="ai-summary-text" class="text-xs text-slate-400">برای دریافت خلاصه کلیک کنید.</div>
                </div>
            </div>
            <div class="pt-2 border-t border-slate-800 flex space-x-2 space-x-reverse">
                <a id="modal-link" href="#" target="_blank" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-center py-2.5 rounded-xl text-xs font-medium transition">مشاهده متن کامل در سایت میزان</a>
                <button id="modal-bookmark-btn" onclick="toggleBookmarkCurrent()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl text-xs transition">🔖 نشان کردن</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyLAmhCoWqHKBNUUarrgXzXrasbpy7Ygq0V4dJCMwu5EwNJs5dxM_NvcXgzJBW68A4p/exec";
        
        let appData = { news: [], tabs: [], legalSystems: [], faq: [] };
        let currentUserId = "guest";
        let currentUserName = "کاربر مهمان";
        let activeTab = "all";
        let selectedNewsItem = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.expand();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    currentUserId = tg.initDataUnsafe.user.id.toString();
                    currentUserName = (tg.initDataUnsafe.user.first_name || "") + " " + (tg.initDataUnsafe.user.last_name || "");
                    document.getElementById('user-badge').innerText = currentUserName.trim() || "کاربر تلگرام";
                }
            }
            fetchAllData();
        });

        function fetchAllData() {
            fetch(`${API_URL}?action=get_all&userId=${currentUserId}`)
                .then(res => res.json())
                .then(data => {
                    appData = data;
                    document.getElementById('loading-view').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    renderTabs();
                    renderNews();
                    renderLegalSystems();
                })
                .catch(err => {
                    console.error("Error fetching data:", err);
                    document.getElementById('loading-view').innerHTML = '<p class="text-red-400 text-xs">خطا در بارگذاری اطلاعات. لطفاً صفحه را مجدد بارگذاری کنید.</p>';
                });
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            
            const allBtn = document.createElement('button');
            allBtn.className = `px-4 py-1.5 rounded-xl text-xs font-medium shrink-0 transition ${activeTab === 'all' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
            allBtn.innerText = "کل اخبار";
            allBtn.onclick = () => { activeTab = 'all'; renderNews(); renderTabs(); };
            container.appendChild(allBtn);

            if (appData.tabs && Array.isArray(appData.tabs)) {
                appData.tabs.forEach(tab => {
                    if (tab.is_active || tab.is_active === "TRUE" || tab.is_active === true) {
                        const btn = document.createElement('button');
                        btn.className = `px-4 py-1.5 rounded-xl text-xs font-medium shrink-0 transition ${activeTab === tab.tab_id ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                        btn.innerText = tab.tab_name;
                        btn.onclick = () => { activeTab = tab.tab_id.toString().toLowerCase(); renderNews(); renderTabs(); };
                        container.appendChild(btn);
                    }
                });
            }
        }

        function renderNews() {
            const list = document.getElementById('news-list');
            list.innerHTML = '';

            const filtered = activeTab === 'all' 
                ? appData.news 
                : appData.news.filter(n => n.category && n.category.toString().toLowerCase() === activeTab);

            if (filtered.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-400 text-center py-8">هیچ خبری در این دسته‌بندی وجود ندارد.</p>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/60 border border-slate-700/60 rounded-2xl p-3 flex space-x-3 space-x-reverse hover:border-slate-600 transition cursor-pointer";
                card.onclick = () => openDetailModal(item);

                card.innerHTML = `
                    <img src="${item.image || 'https://www.mizanonline.ir/files/fa/news/d/2023/1/1/658933_705.jpg'}" class="w-20 h-20 rounded-xl object-cover shrink-0 bg-slate-900" alt="news">
                    <div class="flex-1 flex flex-col justify-between">
                        <h3 class="font-bold text-xs text-slate-100 line-clamp-2 leading-relaxed">${item.title}</h3>
                        <div class="flex items-center justify-between mt-2">
                            <span class="text-[10px] text-slate-400">${item.pubDate ? new Date(item.pubDate).toLocaleDateString('fa-IR') : 'امروز'}</span>
                            <span class="text-[10px] bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded-md">مشاهده</span>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function renderLegalSystems() {
            const container = document.getElementById('legal-systems-list');
            container.innerHTML = '';
            if (appData.legalSystems && Array.isArray(appData.legalSystems)) {
                appData.legalSystems.forEach(sys => {
                    const card = document.createElement('a');
                    card.href = sys.url || '#';
                    card.target = '_blank';
                    card.className = "bg-slate-800/40 hover:bg-slate-800 border border-slate-700/60 rounded-xl p-3 flex flex-col justify-between transition";
                    card.innerHTML = `
                        <div class="font-bold text-xs text-slate-200">${sys.title}</div>
                        <div class="text-[10px] text-slate-400 mt-1">${sys.description}</div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function openDetailModal(item) {
            selectedNewsItem = item;
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-summary').innerText = item.summary;
            document.getElementById('modal-link').href = item.link;
            document.getElementById('ai-summary-text').innerText = "برای دریافت خلاصه کلیک کنید.";
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
            selectedNewsItem = null;
        }

        function summarizeCurrentNews() {
            if (!selectedNewsItem) return;
            const summaryBox = document.getElementById('ai-summary-text');
            summaryBox.innerText = "در حال خلاصه‌سازی با هوش مصنوعی...";
            
            fetch(`${API_URL}?action=ai_summary&text=${encodeURIComponent(selectedNewsItem.summary)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        summaryBox.innerText = data.summary;
                    } else {
                        summaryBox.innerText = "خطا در دریافت خلاصه.";
                    }
                })
                .catch(err => {
                    summaryBox.innerText = "خطا در ارتباط با سرور هوش مصنوعی.";
                });
        }

        function askAI() {
            const query = document.getElementById('ai-query-input').value.trim();
            const responseBox = document.getElementById('ai-response-box');
            if (!query) return;

            responseBox.classList.remove('hidden');
            responseBox.innerText = "وکیل هوشمند در حال تحلیل و پاسخ به پرسش شماست...";

            fetch(`${API_URL}?action=ai_chat&query=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        responseBox.innerText = data.reply;
                    } else {
                        responseBox.innerText = "خطا در دریافت پاسخ.";
                    }
                })
                .catch(err => {
                    responseBox.innerText = "خطا در برقراری ارتباط با وکیل هوشمند.";
                });
        }

        function toggleBookmarkCurrent() {
            if (!selectedNewsItem) return;
            fetch(`${API_URL}?action=save_bookmark&userId=${currentUserId}&title=${encodeURIComponent(selectedNewsItem.title)}&link=${encodeURIComponent(selectedNewsItem.link)}&summary=${encodeURIComponent(selectedNewsItem.summary)}&category=${encodeURIComponent(selectedNewsItem.category || 'general')}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert("خبر با موفقیت به نشان‌شده‌ها اضافه شد.");
                    }
                });
        }

        function switchView(viewName) {
            if (viewName === 'bookmarks') {
                fetch(`${API_URL}?action=bookmarks&userId=${currentUserId}`)
                    .then(res => res.json())
                    .then(bookmarks => {
                        const list = document.getElementById('news-list');
                        list.innerHTML = '<h2 class="text-sm font-bold text-slate-300 px-1 mb-2">اخبار نشان‌شده شما</h2>';
                        if (bookmarks.length === 0) {
                            list.innerHTML += '<p class="text-xs text-slate-400 text-center py-8">هیچ خبری نشان نشده است.</p>';
                            return;
                        }
                        bookmarks.forEach(item => {
                            const card = document.createElement('div');
                            card.className = "bg-slate-800/60 border border-slate-700/60 rounded-2xl p-3 flex flex-col space-y-2";
                            card.innerHTML = `
                                <h3 class="font-bold text-xs text-slate-100">${item.title}</h3>
                                <p class="text-[11px] text-slate-400 line-clamp-2">${item.summary}</p>
                                <a href="${item.link}" target="_blank" class="text-[10px] text-blue-400 hover:underline">مشاهده خبر اصلی</a>
                            `;
                            list.appendChild(card);
                        });
                    });
            } else if (viewName === 'news') {
                renderNews();
            } else if (viewName === 'faq') {
                const list = document.getElementById('news-list');
                list.innerHTML = '<h2 class="text-sm font-bold text-slate-300 px-1 mb-2">پرسش‌های حقوقی پرتکرار</h2>';
                if (appData.faq && appData.faq.length > 0) {
                    appData.faq.forEach(f => {
                        const card = document.createElement('div');
                        card.className = "bg-slate-800/60 border border-slate-700/60 rounded-2xl p-3 space-y-1";
                        card.innerHTML = `
                            <div class="font-bold text-xs text-slate-200">❓ ${f.question}</div>
                            <div class="text-[11px] text-slate-400">💡 ${f.answer}</div>
                        `;
                        list.appendChild(card);
                    });
                } else {
                    list.innerHTML += '<p class="text-xs text-slate-400 text-center py-8">پرسشی ثبت نشده است.</p>';
                }
            }
        }
    </script>
</body>
</html>
