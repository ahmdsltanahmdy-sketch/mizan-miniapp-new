<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خبرگزاری میزان | مینی‌اپ خبری پیشرفته</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { mizan: { 600: '#c51b24', 700: '#9b131a' } } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: var(--selected-font, Tahoma), Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .ultra-glass {
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            color: #f8fafc !important;
        }
        .light .ultra-glass, body:not(.dark) .ultra-glass {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12);
            color: #0f172a !important;
        }

        .glass-tab { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff !important; }
        .dark .glass-tab { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); }
        .reading-mode-active { background-color: #fdf8f0 !important; color: #1e1b18 !important; }
        .dark .reading-mode-active { background-color: #0f172a !important; color: #f8fafc !important; }

        .header-bg {
            background-image: url('https://raw.githubusercontent.com/ahmdsltanahmdy-sketch/mizan-miniapp-new/main/photo_2026-09-15_10-06-27.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body id="bodyRoot" class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col text-xs relative">

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyLAmhCoWqHKBNUUarrgXzXrasbpy7Ygq0V4dJCMwu5EwNJs5dxM_NvcXgzJBW68A4p/exec'; 
        let userId = localStorage.getItem('mizan_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('mizan_user_id', userId);
        }
        if (localStorage.getItem('mizan_theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.body.classList.add('dark');
        }
    </script>

    <!-- هدر اپلیکیشن همراه با منوی تنظیمات -->
    <header id="appHeader" class="sticky top-0 z-50 header-bg dark:bg-slate-900 text-white shadow-md">
        <div class="max-w-md mx-auto px-4 py-2 flex items-center justify-between border-b border-white/10 text-[10px]">
            <div class="flex items-center space-x-2 space-x-reverse">
                <i class="fa-regular fa-calendar-days text-amber-400"></i>
                <span id="headerCalendarWidget">تقویم...</span>
            </div>
            <div class="flex items-center space-x-2 space-x-reverse">
                <span id="headerWeatherWidget">تهران...</span>
                <button onclick="manualRefresh()" title="بروزرسانی" class="p-1.5 rounded-full hover:bg-white/10 transition"><i id="refreshIcon" class="fa-solid fa-rotate text-xs"></i></button>
                <button onclick="toggleSettingsMenu(event)" title="تنظیمات" class="p-1.5 rounded-full hover:bg-white/10 transition"><i class="fa-solid fa-gear text-sm"></i></button>
            </div>
        </div>

        <!-- منوی کشویی تنظیمات -->
        <div id="settingsDropdown" class="hidden absolute left-4 top-12 z-50 max-w-xs w-72 p-4 ultra-glass rounded-3xl space-y-3 text-xs shadow-2xl border border-white/30">
            <div class="flex items-center justify-between pb-2 border-b border-white/20">
                <span class="font-bold">نصب مینی‌اپ:</span>
                <button onclick="showInstallGuide(); document.getElementById('settingsDropdown').classList.add('hidden');" class="bg-amber-500 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold shadow">راهنمای نصب</button>
            </div>
            <div class="flex items-center justify-between pb-2 border-b border-white/20">
                <span class="font-bold">حالت نمایش:</span>
                <button onclick="toggleTheme()" class="bg-white/20 px-3 py-1 rounded-xl font-medium border border-white/20"><i id="theme-icon" class="fa-solid fa-moon"></i> تیره / روشن</button>
            </div>
            <div class="flex items-center justify-between pb-2 border-b border-white/20">
                <span class="font-bold">قلم مینی‌اپ:</span>
                <div class="space-x-1 space-x-reverse">
                    <button onclick="changeFontFamily('Tahoma')" class="px-2 py-0.5 bg-white/20 rounded-lg">Tahoma</button>
                    <button onclick="changeFontFamily('Vazirmatn')" class="px-2 py-0.5 bg-white/20 rounded-lg">وزیر</button>
                </div>
            </div>
        </div>

        <div id="tabsContainer" class="max-w-md mx-auto px-4 flex space-x-2 space-x-reverse overflow-x-auto hide-scrollbar py-2"></div>
    </header>

    <!-- مودال راهنمای نصب -->
    <div id="installGuideModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="ultra-glass rounded-3xl max-w-sm w-full p-5 relative shadow-2xl space-y-3 text-right">
            <button onclick="closeInstallGuide()" class="absolute top-3 left-3 text-slate-400"><i class="fa-solid fa-xmark text-base"></i></button>
            <h3 class="font-bold text-sm text-[#c51b24]">نصب مینی‌اپ میزان</h3>
            <p class="text-[11px] leading-relaxed opacity-90">منوی مرورگر را باز کرده و گزینه <span class="text-red-500 font-bold">«افزودن به صفحه اصلی»</span> را انتخاب کنید.</p>
            <button onclick="closeInstallGuide()" class="w-full bg-[#c51b24] text-white py-2.5 rounded-xl text-xs font-bold">متوجه شدم</button>
        </div>
    </div>

    <!-- بدنه اصلی مینی‌اپ -->
    <main id="mainContentArea" class="max-w-md mx-auto w-full p-4 flex-grow mb-28">
        <!-- تب اخبار -->
        <section id="news-tab" class="page-section">
            <div id="featuredNewsContainer" class="mb-4"></div>
            <div id="newsListContainer" class="space-y-3">
                <div class="text-center py-10 opacity-70"><i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i><p>در حال بارگذاری اخبار...</p></div>
            </div>
        </section>

        <!-- تب پخش زنده -->
        <section id="multimedia-tab" class="page-section hidden space-y-3">
            <div class="ultra-glass rounded-3xl overflow-hidden shadow-xl p-3 space-y-3">
                <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-black shadow-inner flex items-center justify-center">
                    <video id="liveStreamVideo" class="w-full h-full object-contain" controls autoplay playsinline></video>
                </div>
                <div class="p-1 flex items-center justify-between">
                    <div>
                        <h3 id="liveStreamTitle" class="font-bold text-xs text-red-500">پخش زنده سراسری</h3>
                        <p id="liveStreamDesc" class="text-[10px] opacity-80">در حال پخش از سرور میزان</p>
                    </div>
                    <a id="externalStreamBtn" href="#" target="_blank" class="bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-xl text-[10px] font-bold transition hover:bg-red-600 hover:text-white">
                        <i class="fa-solid fa-external-link-alt ml-1"></i> تماشای خارجی
                    </a>
                </div>
            </div>
            <div id="liveChannelsSelector" class="grid grid-cols-2 gap-2"></div>
        </section>

        <!-- تب توییتر -->
        <section id="twitter-tab" class="page-section hidden space-y-3"><div id="twitterFeedContainer" class="space-y-3"></div></section>
        <!-- تب ذخیره‌شده‌ها -->
        <section id="bookmarks-tab" class="page-section hidden space-y-3"><div id="bookmarksListContainer" class="space-y-3"></div></section>
        <!-- تب سامانه‌های قضایی -->
        <section id="legal-tab" class="page-section hidden"><div id="legalSystemsContainer" class="space-y-3"></div></section>
        <!-- تب پرونده‌ها -->
        <section id="files-tab" class="page-section hidden"><div id="filesContainer" class="space-y-3"></div></section>

        <!-- تب وکیل آنلاین -->
        <section id="lawyer-tab" class="page-section hidden space-y-4">
            <div class="ultra-glass p-4 rounded-2xl shadow-sm border border-white/15">
                <h2 class="font-bold text-xs text-red-600 flex items-center mb-2"><i class="fa-solid fa-user-tie ml-1.5"></i> پرسش از وکیل آنلاین</h2>
                <textarea id="questionInput" placeholder="سوال حقوقی خود را بنویسید..." class="w-full bg-black/20 rounded-xl p-3 text-xs focus:outline-none h-24 mb-2 resize-none border border-white/10"></textarea>
                <button id="submitQuestionBtn" onclick="submitQuestion()" class="w-full bg-[#c51b24] text-white py-2.5 rounded-xl text-xs font-bold shadow">ارسال سوال</button>
            </div>
            <div id="officialMessagesContainer" class="space-y-3"></div>
        </section>
    </main>

    <!-- ناوبری پایین صفحه -->
    <nav class="fixed bottom-0 left-0 right-0 ultra-glass border-t border-white/20 max-w-md mx-auto py-2 px-1 flex justify-between items-center z-50 shadow-2xl">
        <button onclick="switchTab('news-tab', this)" class="nav-btn flex flex-col items-center text-red-600 transition flex-1 font-bold"><i class="fa-solid fa-newspaper text-sm"></i><span class="text-[8px] mt-1">اخبار</span></button>
        <button onclick="switchTab('multimedia-tab', this)" class="nav-btn flex flex-col items-center opacity-70 hover:opacity-100 transition flex-1"><i class="fa-solid fa-tower-broadcast text-sm"></i><span class="text-[8px] mt-1">پخش زنده</span></button>
        <button onclick="switchTab('twitter-tab', this)" class="nav-btn flex flex-col items-center opacity-70 hover:opacity-100 transition flex-1"><i class="fa-solid fa-hashtag text-sm"></i><span class="text-[8px] mt-1">توییتر</span></button>
        <button onclick="switchTab('bookmarks-tab', this)" class="nav-btn flex flex-col items-center opacity-70 hover:opacity-100 transition flex-1"><i class="fa-solid fa-bookmark text-sm"></i><span class="text-[8px] mt-1">ذخیره</span></button>
        <button onclick="switchTab('files-tab', this)" class="nav-btn flex flex-col items-center opacity-70 hover:opacity-100 transition flex-1"><i class="fa-solid fa-folder-open text-sm"></i><span class="text-[8px] mt-1">پرونده‌ها</span></button>
        <button onclick="switchTab('legal-tab', this)" class="nav-btn flex flex-col items-center opacity-70 hover:opacity-100 transition flex-1"><i class="fa-solid fa-scale-balanced text-sm"></i><span class="text-[8px] mt-1">سامانه‌ها</span></button>
        <button onclick="switchTab('lawyer-tab', this)" class="nav-btn flex flex-col items-center opacity-70 hover:opacity-100 transition flex-1"><i class="fa-solid fa-user-tie text-sm"></i><span class="text-[8px] mt-1">مشاور</span></button>
    </nav>

    <!-- اسکریپت و منطق اجرایی -->
    <script>
        let appData = { news: [], tabs: [], legalSystems: [], files: [], faq: [], twitter: [], livestream: [] };
        let activeHlsPlayer = null;

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
            updateDateTime();
            setInterval(updateDateTime, 1000);
            fetchTehranWeather();
        });

        function updateDateTime() {
            const now = new Date();
            const calElem = document.getElementById('headerCalendarWidget');
            if(calElem) calElem.innerText = now.toLocaleDateString('fa-IR', { calendar: 'persian', year: 'numeric', month: 'long', day: 'numeric' });
        }

        async function fetchTehranWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.6892&longitude=51.3890&current_weather=true');
                const data = await res.json();
                if (data && data.current_weather) {
                    document.getElementById('headerWeatherWidget').innerText = `تهران ${Math.round(data.current_weather.temperature)}°C`;
                }
            } catch(e) {
                document.getElementById('headerWeatherWidget').innerText = `تهران ۲۳°C`;
            }
        }

        async function initApp() {
            try {
                const response = await fetch(API_URL + "?action=get_all&t=" + new Date().getTime());
                appData = await response.json();
                renderAll();
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('newsListContainer').innerHTML = '<p class="text-center text-red-500 py-8">خطا در بارگذاری اطلاعات از سرور.</p>';
            }
        }

        async function manualRefresh() {
            const icon = document.getElementById('refreshIcon');
            if(icon) icon.classList.add('fa-spin');
            await initApp();
            setTimeout(() => { if(icon) icon.classList.remove('fa-spin'); }, 600);
        }

        function toggleSettingsMenu(event) {
            if(event) event.stopPropagation();
            document.getElementById('settingsDropdown').classList.toggle('hidden');
        }

        function changeFontFamily(fontName) {
            document.documentElement.style.setProperty('--selected-font', fontName);
            localStorage.setItem('mizan_font', fontName);
            document.getElementById('settingsDropdown').classList.add('hidden');
        }

        function showInstallGuide() { document.getElementById('installGuideModal').classList.remove('hidden'); }
        function closeInstallGuide() { document.getElementById('installGuideModal').classList.add('hidden'); }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.body.classList.toggle('dark', isDark);
            localStorage.setItem('mizan_theme', isDark ? 'dark' : 'light');
            document.getElementById('settingsDropdown').classList.add('hidden');
        }

        function renderAll() {
            renderTabs();
            renderNews();
            renderFiles();
            renderOfficialMessages();
            renderLiveChannels();
        }

        function renderLiveChannels() {
            const container = document.getElementById('liveChannelsSelector');
            if (!container) return;

            let streams = appData.livestream || [];
            if (!streams.length) {
                streams = [{ title: "پخش زنده سراسری", url: "https://live-aburayhan1104.telewebion.net/ek/irinn/live/240p/index.m3u8", description: "شبکه خبر / سراسری میزان" }];
            }

            container.innerHTML = streams.map((stream) => `
                <button onclick='playSelectedStream(${JSON.stringify(stream).replace(/'/g, "&apos;")})' class="p-3 ultra-glass rounded-2xl text-right transition border hover:border-red-500 space-y-1 shadow-sm">
                    <div class="font-bold text-xs text-red-500 flex items-center"><i class="fa-solid fa-tv ml-1"></i> ${stream.title}</div>
                    <div class="text-[10px] opacity-80 truncate">${stream.description || 'کانال تلویزیونی'}</div>
                </button>
            `).join('');

            playSelectedStream(streams[0]);
        }

        function playSelectedStream(stream) {
            const videoElem = document.getElementById('liveStreamVideo');
            const titleElem = document.getElementById('liveStreamTitle');
            const extBtn = document.getElementById('externalStreamBtn');

            if(titleElem) titleElem.innerText = stream.title;
            if(extBtn) extBtn.href = stream.url;

            if (videoElem && stream.url) {
                if (activeHlsPlayer) {
                    activeHlsPlayer.destroy();
                    activeHlsPlayer = null;
                }

                let streamUrl = stream.url;
                if (streamUrl.includes('.m3u8') && !streamUrl.includes('allorigins')) {
                    streamUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(stream.url);
                }

                if (Hls.isSupported()) {
                    const hls = new Hls();
                    activeHlsPlayer = hls;
                    hls.loadSource(streamUrl);
                    hls.attachMedia(videoElem);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        videoElem.play().catch(e => console.log("Autoplay restricted:", e));
                    });
                } else if (videoElem.canPlayType('application/vnd.apple.mpegurl')) {
                    videoElem.src = streamUrl;
                    videoElem.addEventListener('loadedmetadata', () => {
                        videoElem.play().catch(e => console.log("Autoplay restricted:", e));
                    });
                }
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            if (!container || !appData.tabs) return;
            container.innerHTML = appData.tabs.map(t => `<button class="px-3 py-1 rounded-full text-xs glass-tab">${t.tab_name}</button>`).join('');
        }

        function renderNews() {
            const container = document.getElementById('newsListContainer');
            if (!container || !appData.news) return;
            if (!appData.news.length) {
                container.innerHTML = '<p class="text-center text-slate-400 py-8 text-xs">هیچ خبری یافت نشد.</p>';
                return;
            }
            container.innerHTML = appData.news.slice(0, 15).map(n => `
                <div class="ultra-glass p-3 rounded-2xl space-y-1 cursor-pointer">
                    <h3 class="font-bold text-xs">${n.title}</h3>
                    <p class="text-[10px] opacity-80">${n.summary || ''}</p>
                </div>
            `).join('');
        }

        function renderFiles() {
            const container = document.getElementById('filesContainer');
            if (!container || !appData.files) return;
            container.innerHTML = appData.files.map(f => `
                <div class="ultra-glass p-3 rounded-2xl space-y-1">
                    <h3 class="font-bold text-xs text-red-500">${f.title}</h3>
                    <p class="text-[10px] opacity-80">${f.description}</p>
                </div>
            `).join('');
        }

        function renderOfficialMessages() {
            const container = document.getElementById('officialMessagesContainer');
            if (!container || !appData.faq) return;
            container.innerHTML = appData.faq.map(q => `
                <div class="ultra-glass p-3 rounded-2xl space-y-1">
                    <h4 class="font-bold text-xs text-red-500">سوال: ${q.question}</h4>
                    <p class="text-[10px] opacity-90">پاسخ: ${q.answer}</p>
                </div>
            `).join('');
        }

        async function submitQuestion() {
            const q = document.getElementById('questionInput').value.trim();
            if (!q) return alert('لطفا سوال خود را وارد کنید.');
            try {
                const res = await fetch(API_URL + "?action=add_faq&userId=" + userId + "&question=" + encodeURIComponent(q));
                const result = await res.json();
                if(result.status === "success") {
                    alert('سوال با موفقیت ثبت شد.');
                    document.getElementById('questionInput').value = '';
                    initApp();
                } else {
                    alert(result.message || 'خطا در ثبت سوال.');
                }
            } catch(e) { alert('خطا در ارسال.'); }
        }

        function switchTab(sectionId, btn) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(sectionId).classList.remove('hidden');
        }
    </script>
</body>
</html>
