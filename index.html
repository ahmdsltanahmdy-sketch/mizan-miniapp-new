<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مینی‌اپ حقوقی SIJT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f3f4f6);
      --text-color: var(--tg-theme-text-color, #1f2937);
      --hint-color: var(--tg-theme-hint-color, #6b7280);
      --button-color: var(--tg-theme-button-color, #2563eb);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
    }
    body { background-color: var(--bg-color); color: var(--text-color); font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: var(--card-bg); }
    .btn-tg { background-color: var(--button-color); color: var(--button-text); }
  </style>
</head>
<body class="p-4 max-w-md mx-auto pb-24">

  <!-- Header -->
  <div class="flex items-center justify-between mb-4 p-4 card rounded-2xl shadow-sm">
    <h1 class="text-base font-bold">⚖️ سامانه جامع حقوقی SIJT</h1>
    <span id="userBadge" class="text-xs px-2.5 py-1 rounded-full bg-blue-100 text-blue-600 font-medium">فعال</span>
  </div>

  <!-- Navigation Tabs -->
  <div class="grid grid-cols-4 gap-1 mb-4 text-[11px] font-semibold text-center">
    <button onclick="switchTab('lawyer')" id="tab-lawyer" class="p-2 card rounded-xl shadow-sm border-b-2 border-blue-600">وکیل آنلاین</button>
    <button onclick="switchTab('tracking')" id="tab-tracking" class="p-2 card rounded-xl shadow-sm">پیگیری</button>
    <button onclick="switchTab('public')" id="tab-public" class="p-2 card rounded-xl shadow-sm">بانک سوالات</button>
    <button onclick="switchTab('tools')" id="tab-tools" class="p-2 card rounded-xl shadow-sm">ابزار و اخبار</button>
  </div>

  <!-- Tab 1: Lawyer & Ask -->
  <div id="content-lawyer" class="space-y-4">
    <div class="card p-4 rounded-2xl shadow-sm space-y-3">
      <h2 class="font-bold text-sm">پرسش از وکیل متخصص</h2>
      <select id="questionCategory" class="w-full p-2.5 rounded-xl border text-sm card">
        <option value="کیفری">حقوق کیفری و جرایم</option>
        <option value="خانواده">خانواده و مهریه</option>
        <option value="ملکی">املاک و قراردادها</option>
        <option value="ثبتی">ثبت احوال و اسناد</option>
        <option value="عمومی">سایر موضوعات عمومی</option>
      </select>
      <textarea id="questionText" rows="4" placeholder="شرح کامل پرونده یا سوال حقوقی..." class="w-full p-3 rounded-xl border text-sm card resize-none focus:outline-none"></textarea>
      <button onclick="submitQuestion()" class="w-full py-3 rounded-xl font-bold btn-tg text-sm shadow-md">ارسال سوال به وکیل</button>
    </div>
  </div>

  <!-- Tab 2: Tracking -->
  <div id="content-tracking" class="space-y-4 hidden">
    <div class="card p-4 rounded-2xl shadow-sm space-y-3">
      <h2 class="font-bold text-sm">پیگیری وضعیت پرونده / سوال</h2>
      <input type="text" id="trackingInput" placeholder="کد رهگیری (مثلاً SIJT-1234)" class="w-full p-3 rounded-xl border text-sm card">
      <button onclick="trackQuestion()" class="w-full py-3 rounded-xl font-bold btn-tg text-sm">استعلام وضعیت</button>
      <div id="trackingResult" class="mt-3 space-y-2 text-sm"></div>
    </div>
  </div>

  <!-- Tab 3: Public FAQs -->
  <div id="content-public" class="space-y-3 hidden">
    <h2 class="font-bold text-sm">پرسش و پاسخ‌های تاییدشده</h2>
    <div id="publicFaqsList" class="space-y-2"></div>
  </div>

  <!-- Tab 4: Tools & News -->
  <div id="content-tools" class="space-y-4 hidden">
    <div class="card p-4 rounded-2xl shadow-sm space-y-3">
      <h2 class="font-bold text-sm">🛠️ ابزارهای هوشمند حقوقی</h2>
      <div class="space-y-2">
        <input type="number" id="mehriyehPrice" placeholder="مبلغ سکه/مهریه (تومان)" class="w-full p-2.5 rounded-xl border text-xs card">
        <button onclick="calculateMehriye()" class="w-full py-2 rounded-xl font-bold bg-gray-200 text-gray-800 text-xs">محاسبه تقریبی ارزش روز</button>
        <div id="calcResult" class="text-xs text-blue-600 font-medium"></div>
      </div>
    </div>
    <div class="card p-4 rounded-2xl shadow-sm space-y-2">
      <h2 class="font-bold text-sm">📰 آخرین اخبار و اطلاعیه‌های حقوقی</h2>
      <div id="newsList" class="space-y-2 text-xs"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyLAmhCoWqHKBNUUarrgXzXrasbpy7Ygq0V4dJCMwu5EwNJs5dxM_NvcXgzJBW68A4p/exec";
    let tg = window.Telegram.WebApp;
    tg.expand();

    let userId = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "guest_" + Math.floor(Math.random()*1000);

    function switchTab(tab) {
      ['lawyer', 'tracking', 'public', 'tools'].forEach(t => {
        document.getElementById('content-' + t).classList.add('hidden');
        document.getElementById('tab-' + t).style.borderBottom = 'none';
      });
      document.getElementById('content-' + tab).classList.remove('hidden');
      document.getElementById('tab-' + tab).style.borderBottom = '2px solid var(--button-color)';
    }

    async function submitQuestion() {
      let q = document.getElementById('questionText').value.trim();
      let cat = document.getElementById('questionCategory').value;
      if (!q) return alert('لطفاً متن سوال را وارد کنید.');

      tg.MainButton.showProgress();
      try {
        let res = await fetch(`${API_URL}?action=add_faq&question=${encodeURIComponent(q)}&userId=${userId}&category=${encodeURIComponent(cat)}`);
        let data = await res.json();
        if (data.status === 'success') {
          alert('سوال شما با موفقیت ثبت شد!\nکد رهگیری: ' + data.trackingCode);
          document.getElementById('questionText').value = '';
          switchTab('tracking');
          document.getElementById('trackingInput').value = data.trackingCode;
          trackQuestion();
        } else {
          alert(data.message || 'خطا در ارسال');
        }
      } catch (e) {
        alert('خطا در ارتباط با سرور');
      }
      tg.MainButton.hideProgress();
    }

    async function trackQuestion() {
      let code = document.getElementById('trackingInput').value.trim();
      if (!code) return alert('کد رهگیری را وارد کنید.');
      let resDiv = document.getElementById('trackingResult');
      resDiv.innerHTML = 'در حال جستجو...';

      try {
        let res = await fetch(`${API_URL}?action=get_user_faqs&trackingCode=${code}`);
        let data = await res.json();
        if (data.status === 'success' && data.faqs.length > 0) {
          let item = data.faqs[0];
          resDiv.innerHTML = `
            <div class="p-3 rounded-xl border card space-y-1">
              <div class="text-xs text-gray-500">موضوع: ${item.category} | تاریخ: ${item.date}</div>
              <p class="font-bold text-xs">سوال: ${item.question}</p>
              <hr class="my-1 border-gray-200">
              <p class="text-xs text-blue-600">پاسخ وکیل: ${item.hasAnswer ? item.answer : 'هنوز پاسخی داده نشده است (در صف بررسی)'}</p>
            </div>`;
        } else {
          resDiv.innerHTML = '<p class="text-xs text-red-500">سوالی با این کد رهگیری پیدا نشد.</p>';
        }
      } catch (e) {
        resDiv.innerHTML = '<p class="text-xs text-red-500">خطا در بارگذاری اطلاعات.</p>';
      }
    }

    function calculateMehriye() {
      let val = document.getElementById('mehriyehPrice').value;
      if(!val) return alert('مبلغ را وارد کنید');
      document.getElementById('calcResult').innerText = 'محاسبه انجام شد. جهت دریافت نرخ دقیق روز به وکیل پیام دهید.';
    }

    async function loadInitialData() {
      try {
        let res = await fetch(`${API_URL}?action=get_all`);
        let data = await res.json();
        
        let pubList = document.getElementById('publicFaqsList');
        pubList.innerHTML = data.publicFaqs.map(f => `
          <div class="p-3 rounded-xl border card space-y-1">
            <span class="text-[10px] bg-gray-100 px-2 py-0.5 rounded text-gray-600">${f.category}</span>
            <p class="font-bold text-xs">❓ ${f.question}</p>
            <p class="text-xs text-gray-600">💡 ${f.answer}</p>
          </div>
        `).join('') || '<p class="text-xs text-gray-500">موردی یافت نشد.</p>';

        let newsList = document.getElementById('newsList');
        newsList.innerHTML = data.news.map(n => `
          <div class="p-2 rounded border card">
            <p class="font-bold">${n.title || ''}</p>
            <p class="text-gray-500">${n.description || ''}</p>
          </div>
        `).join('') || '<p class="text-xs text-gray-500">خبری موجود نیست.</p>';
      } catch(e) {}
    }
    loadInitialData();
  </script>
</body>
</html>
