<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIJT - مینی‌اپ تخصصی حقوقی</title>
    
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
        %22name%22: %22SIJT%22,
        %22short_name%22: %22SIJT%22,
        %22start_url%22: %22.%22,
        %22display%22: %22standalone%22,
        %22background_color%22: %22%230f172a%22,
        %22theme_color%22: %22%23c51b24%22,
        %22icons%22: [
            {
                %22src%22: %22https://raw.githubusercontent.com/ahmdsltanahmdy-sketch/sijt-v01/main/01.png%22,
                %22sizes%22: %22512x512%22,
                %22type%22: %22image/jpeg%22
            }
        ]
    }">

    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/ahmdsltanahmdy-sketch/sijt-v01/main/01.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ahmdsltanahmdy-sketch/sijt-v01/main/01.png">
    <meta name="theme-color" content="#c51b24">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { mizan: { 600: '#c51b24', 700: '#9b131a' } } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: var(--selected-font, Tahoma), Arial, sans-serif; font-size: var(--app-font-size, 12px); line-height: 1.8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .ultra-glass {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            color: #f8fafc;
            transition: all 0.3s ease;
        }
        .light .ultra-glass, body:not(.dark) .ultra-glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            color: #0f172a;
        }

        .settings-glass {
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            color: #ffffff;
        }
        .light .settings-glass, body:not(.dark) .settings-glass {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            color: #0f172a;
        }

        .glass-tab { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff !important; }
        .dark .glass-tab { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); }

        .header-bg {
            background-image: url('https://raw.githubusercontent.com/ahmdsltanahmdy-sketch/mizan-miniapp-new/main/photo_2026-09-15_10-06-27.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .card-bg-glass {
            background-image: linear-gradient(rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.94)), url('https://raw.githubusercontent.com/ahmdsltanahmdy-sketch/sijt-v01/main/01.png');
            background-size: cover;
            background-position: center;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        button, a, .clickable-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
        button:active, a:active, .clickable-card:active { transform: scale(0.96); }

        .page-section { animation: fadeInScale 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInScale {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.18) 50%, rgba(255,255,255,0.06) 75%);
            background-size: 200% 100%;
            animation: skeletonLoading 1.5s infinite;
            border-radius: 12px;
        }
        @keyframes skeletonLoading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .bottom-sheet { transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .bottom-sheet.show { transform: translateY(0); }

        .story-ring {
            background: linear-gradient(45deg, #f59e0b, #c51b24, #9333ea);
            padding: 2px;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
        }
    </style>
</head>
<body id="bodyRoot" class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col relative">

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyrMOSKpL5rwv5C9okpDQvbKE07-1JFP2ZE5xt7Xt4Y9sSvIUwbXZWU6ssTbBgQRgSZ/exec'; 
        
        let userId = sessionStorage.getItem('mizan_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            sessionStorage.setItem('mizan_user_id', userId);
        }
        if (localStorage.getItem('mizan_theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.body.classList.add('dark');
        }

        const savedFont = localStorage.getItem('mizan_font') || 'Tahoma';
        document.documentElement.style.setProperty('--selected-font', savedFont);
        const savedFontSize = localStorage.getItem('mizan_font_size') || '12px';
        document.documentElement.style.setProperty('--app-font-size', savedFontSize);

        let tgSettings = { haptic: localStorage.getItem('tg_haptic') !== 'false' };

        function triggerHaptic(type = 'medium') {
            if (tgSettings.haptic && window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                try {
                    if(type === 'light') window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
                    else if(type === 'heavy') window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
                    else if(type === 'success') window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                    else window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
                } catch(e) {}
            }
        }
    </script>

    <!-- هدر -->
    <header id="appHeader" class="sticky top-0 z-50 header-bg dark:bg-slate-900 text-white shadow-md transition-all duration-300">
        <div class="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between border-b border-white/10 text-[10px] relative z-20">
            <div class="flex items-center space-x-2 space-x-reverse">
                <i class="fa-regular fa-calendar-days text-amber-400"></i>
                <span id="headerCalendarWidget">تقویم...</span>
            </div>
            
            <div class="flex items-center space-x-2 space-x-reverse px-3 py-1 rounded-2xl bg-gradient-to-r from-red-600/75 to-slate-900 border border-red-500/50 backdrop-blur-xl">
                <div class="w-5 h-5 rounded-lg overflow-hidden border border-white/30 flex-shrink-0">
                    <img src="https://raw.githubusercontent.com/ahmdsltanahmdy-sketch/sijt-v01/main/01.png" class="w-full h-full object-cover" alt="Logo">
                </div>
                <span class="font-black tracking-[0.2em] text-[12px] text-amber-300">SIJT</span>
            </div>

            <div class="flex items-center space-x-2 space-x-reverse">
                <button onclick="toggleNotificationsModal(); triggerHaptic('light');" class="relative p-1.5 rounded-full hover:bg-white/10 transition"><i class="fa-solid fa-bell text-xs text-amber-300"></i></button>
                <span id="headerWeatherWidget">تهران...</span>
                <button onclick="manualRefresh(); triggerHaptic('medium');" class="p-1.5 rounded-full hover:bg-white/10 transition"><i id="refreshIcon" class="fa-solid fa-rotate text-xs"></i></button>
                <button onclick="toggleSettingsMenu(event); triggerHaptic('light');" class="p-1.5 rounded-full hover:bg-white/10 transition"><i class="fa-solid fa-gear text-sm"></i></button>
            </div>
        </div>

        <!-- منوی تنظیمات -->
        <div id="settingsDropdown" class="hidden absolute left-4 top-12 z-50 max-w-xs w-85 p-4 settings-glass rounded-3xl space-y-3 text-xs shadow-2xl">
            <div class="flex items-center justify-between pb-2 border-b border-white/20">
                <span class="font-bold">حالت نمایش:</span>
                <button onclick="toggleTheme(); triggerHaptic('light');" class="bg-white/20 px-3 py-1 rounded-xl">تیره / روشن</button>
            </div>
            <div class="flex items-center justify-between pb-2 border-b border-white/20">
                <span class="font-bold">تمام‌صفحه:</span>
                <button onclick="toggleFullScreen(); triggerHaptic('light');" class="bg-red-600/30 text-red-300 px-3 py-1 rounded-xl">ورود/خروج</button>
            </div>
            <div class="flex items-center justify-between pb-2 border-b border-white/20">
                <span class="font-bold">قلم مینی‌اپ:</span>
                <select id="fontSelect" onchange="changeFontFamily(this.value);" class="bg-slate-800 text-white rounded-lg px-2 py-1 text-[11px]">
                    <option value="Tahoma">Tahoma</option>
                    <option value="Vazirmatn">Vazirmatn</option>
                    <option value="Shabnam">Shabnam</option>
                </select>
            </div>
            <div class="text-center pt-1">
                <button onclick="openAboutModal();" class="text-amber-400 font-bold">درباره ما و پشتیبانی</button>
            </div>
        </div>

        <div class="max-w-md mx-auto px-4 py-2.5 relative z-20">
            <div class="flex space-x-2 space-x-reverse relative items-center">
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" oninput="handleLiveSearch(this.value)" placeholder="جستجوی آنی در سامانه‌ها، پرونده‌ها..." class="w-full bg-black/40 text-white rounded-xl px-4 py-2.5 pr-9 pl-8 text-xs focus:outline-none border border-white/20">
                    <i class="fa-solid fa-magnifying-glass absolute right-3 top-3.5 text-slate-300 text-xs"></i>
                </div>
                <button onclick="openAdvancedSearchModal();" class="glass-tab p-2.5 rounded-xl text-xs text-amber-300"><i class="fa-solid fa-earth-americas text-sm"></i></button>
            </div>
            <div id="liveSuggestionsBox" class="hidden absolute right-4 left-4 top-full mt-1.5 ultra-glass rounded-2xl shadow-2xl z-[100] max-h-60 overflow-y-auto p-2.5 space-y-1"></div>
        </div>
    </header>

    <!-- بدنه اصلی -->
    <main id="mainContentArea" class="max-w-md mx-auto w-full p-4 flex-grow mb-32">
        
        <!-- تب ۱: اصطلاحات -->
        <section id="dictionary-tab" class="page-section space-y-3">
            <div class="flex items-center justify-between mb-1">
                <h2 class="font-bold text-xs flex items-center"><i class="fa-solid fa-book ml-1.5 text-red-600"></i> فرهنگ اصطلاحات حقوقی</h2>
                <span id="dictCounter" class="text-[9px] opacity-70"></span>
            </div>
            <div class="flex space-x-2 space-x-reverse overflow-x-auto hide-scrollbar pb-1 text-[11px]">
                <button onclick="filterDictCategory('all', this);" class="dict-chip px-3 py-1.5 rounded-full bg-red-600 text-white font-bold flex-shrink-0">همه</button>
                <button onclick="filterDictCategory('مدنی', this);" class="dict-chip px-3 py-1.5 rounded-full bg-slate-800 text-slate-200 border border-white/15 flex-shrink-0">حقوق مدنی</button>
                <button onclick="filterDictCategory('کیفری', this);" class="dict-chip px-3 py-1.5 rounded-full bg-slate-800 text-slate-200 border border-white/15 flex-shrink-0">کیفری</button>
            </div>
            <div id="dictionaryContainer" class="space-y-2 mt-2"><div class="skeleton h-20 w-full"></div></div>
        </section>

        <!-- تب ۲: سامانه‌ها -->
        <section id="legal-tab" class="page-section hidden"><div id="legalSystemsContainer" class="space-y-3"><div class="skeleton h-16 w-full"></div></div></section>

        <!-- تب ۳: مشاور -->
        <section id="lawyer-tab" class="page-section hidden space-y-4">
            <div class="ultra-glass p-4 rounded-3xl space-y-4">
                <h2 class="font-extrabold text-xs text-red-500">مشاور و وکیل آنلاین SIJT</h2>
                <select id="questionCategory" class="w-full bg-slate-900 text-white rounded-xl p-2.5 text-xs border border-white/20">
                    <option value="حقوقی عمومی">حقوقی عمومی / قراردادها</option>
                    <option value="کیفری و جرایم">کیفری و جرایم</option>
                    <option value="خانواده و مهریه">خانواده و مهریه</option>
                </select>
                <textarea id="questionInput" placeholder="سوال حقوقی..." class="w-full bg-slate-900 text-white rounded-2xl p-3 text-xs h-24 resize-none border border-white/20"></textarea>
                <button id="submitQuestionBtn" onclick="submitQuestion();" class="w-full bg-red-600 py-2.5 text-xs font-bold text-white rounded-xl">ارسال سوال</button>
                <div id="userFaqsContainer" class="space-y-3 max-h-60 overflow-y-auto"></div>
            </div>
        </section>

        <!-- تب ۴: چت‌بات -->
        <section id="chatbot-tab" class="page-section hidden space-y-3">
            <div class="ultra-glass p-4 rounded-3xl space-y-3">
                <h2 class="font-extrabold text-xs text-red-500">دستیار هوشمند حقوقی SIJT</h2>
                <div id="chatMessagesContainer" class="space-y-2.5 h-[48vh] overflow-y-auto p-2.5 bg-slate-900 rounded-2xl text-[11px]">
                    <div class="text-center text-slate-300 py-4">سلام! سوال خود را بپرسید...</div>
                </div>
                <div class="flex space-x-2 space-x-reverse">
                    <textarea id="aiPromptInput" placeholder="پیام خود را بنویسید..." class="flex-grow bg-slate-900 text-white rounded-xl p-2.5 text-xs h-14 resize-none border border-white/20"></textarea>
                    <button onclick="runAiAssistant();" class="bg-red-600 text-white px-4 rounded-xl text-xs font-bold"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </section>

        <!-- تب ۵: قوانین -->
        <section id="laws-tab" class="page-section hidden space-y-3">
            <h2 class="font-bold text-xs"><i class="fa-solid fa-scale-balanced text-red-600"></i> آرشیو قوانین</h2>
            <div id="lawsContainer" class="space-y-2.5"><div class="skeleton h-24 w-full"></div></div>
        </section>

        <!-- تب ۶: کارت‌ها -->
        <section id="cards-tab" class="page-section hidden space-y-3">
            <h2 class="font-bold text-xs"><i class="fa-solid fa-id-card text-red-600"></i> کارت‌های حقوقی</h2>
            <div class="flex space-x-3 space-x-reverse overflow-x-auto hide-scrollbar py-2" id="storyHighlightsBar"></div>
            <div id="shareCardsContainer" class="space-y-3 mt-2"><div class="skeleton h-32 w-full"></div></div>
        </section>

        <!-- تب ۷: اطلاعیه‌ها -->
        <section id="news-tab" class="page-section hidden space-y-4">
            <h2 class="font-bold text-xs"><i class="fa-solid fa-bullhorn text-red-600"></i> اخبار رسمی</h2>
            <div id="newsContainer" class="space-y-3"><div class="skeleton h-20 w-full"></div></div>
        </section>

        <!-- تب ۸: ابزارها -->
        <section id="tools-tab" class="page-section hidden space-y-3">
            <div class="ultra-glass p-4 rounded-2xl space-y-3">
                <h3 class="font-bold text-xs text-red-400">محاسبه‌گر هزینه دادرسی</h3>
                <input type="number" id="claimAmountInput" placeholder="مبلغ به ریال..." class="w-full bg-slate-900 text-white rounded-xl p-2 text-xs border border-white/20">
                <button onclick="calculateCourtFee()" class="w-full bg-red-600 text-white py-2 rounded-xl text-xs font-bold">محاسبه</button>
                <div id="feeResult" class="text-[11px] font-bold text-amber-300"></div>
            </div>
        </section>

        <!-- تب ۹: سوالات عمومی -->
        <section id="public-faq-tab" class="page-section hidden space-y-3">
            <div id="publicFaqContainer" class="space-y-3"><div class="skeleton h-24 w-full"></div></div>
        </section>

        <!-- تب ۱۰: اینستاگرام -->
        <section id="instagram-tab" class="page-section hidden space-y-3">
            <div id="instagramContainer" class="grid grid-cols-3 gap-3 text-center"></div>
        </section>

        <!-- تب ۱۱: پادکست -->
        <section id="podcasts-tab" class="page-section hidden space-y-3">
            <div id="podcastsContainer" class="space-y-3"></div>
        </section>

        <!-- تب ۱۲: پرونده‌ها -->
        <section id="files-tab" class="page-section hidden">
            <div id="filesContainer" class="space-y-3"></div>
        </section>

        <!-- تب ۱۳: پخش زنده -->
        <section id="multimedia-tab" class="page-section hidden space-y-3">
            <div class="ultra-glass rounded-3xl overflow-hidden p-3 space-y-3">
                <div class="relative w-full aspect-video rounded-2xl bg-slate-950 flex items-center justify-center">
                    <iframe id="liveStreamIframe" class="w-full h-full border-0" allowfullscreen></iframe>
                    <div id="liveStreamPlaceholder" class="absolute inset-0 flex items-center justify-center bg-slate-900 text-slate-400 text-xs">یک شبکه انتخاب کنید</div>
                </div>
            </div>
            <div id="liveChannelsSelector" class="grid grid-cols-2 gap-2"></div>
        </section>

        <!-- تب ۱۴: اینفوگرافیک -->
        <section id="infographics-tab" class="page-section hidden space-y-3">
            <div id="infographicsContainer" class="grid grid-cols-2 gap-3"></div>
        </section>

        <!-- تب ۱۵: سریال -->
        <section id="series-tab" class="page-section hidden space-y-3">
            <div id="seriesContainer" class="grid grid-cols-2 gap-3"></div>
        </section>
    </main>

    <!-- ناوبری پایین -->
    <nav class="fixed bottom-3 left-3 right-3 ultra-glass rounded-3xl border border-white/20 max-w-md mx-auto py-2 px-2 flex space-x-1.5 space-x-reverse overflow-x-auto hide-scrollbar z-50 shadow-2xl items-center whitespace-nowrap">
        <button onclick="switchTab('dictionary-tab', this)" class="nav-btn flex flex-col items-center text-red-500 font-bold px-2 py-1"><i class="fa-solid fa-book text-sm mb-0.5"></i><span class="text-[8px]">اصطلاحات</span></button>
        <button onclick="switchTab('legal-tab', this)" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-solid fa-scale-balanced text-sm mb-0.5"></i><span class="text-[8px]">سامانه‌ها</span></button>
        <button onclick="switchTab('laws-tab', this)" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-solid fa-gavel text-sm mb-0.5"></i><span class="text-[8px]">قوانین</span></button>
        <button onclick="switchTab('cards-tab', this)" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-solid fa-id-card text-sm mb-0.5"></i><span class="text-[8px]">کارت‌ها</span></button>
        <button onclick="switchTab('lawyer-tab', this); loadUserFaqs();" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-solid fa-user-tie text-sm mb-0.5"></i><span class="text-[8px]">مشاور</span></button>
        <button onclick="switchTab('chatbot-tab', this)" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-solid fa-robot text-sm mb-0.5"></i><span class="text-[8px]">چت‌بات</span></button>
        <button onclick="switchTab('news-tab', this)" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-solid fa-bullhorn text-sm mb-0.5"></i><span class="text-[8px]">اطلاعیه‌ها</span></button>
        <button onclick="switchTab('tools-tab', this)" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-solid fa-toolbox text-sm mb-0.5"></i><span class="text-[8px]">ابزارها</span></button>
        <button onclick="switchTab('public-faq-tab', this)" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-solid fa-clipboard-question text-sm mb-0.5"></i><span class="text-[8px]">بانک سوال</span></button>
        <button onclick="switchTab('instagram-tab', this)" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-brands fa-instagram text-sm mb-0.5"></i><span class="text-[8px]">اینستاگرام</span></button>
        <button onclick="switchTab('podcasts-tab', this)" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-solid fa-podcast text-sm mb-0.5"></i><span class="text-[8px]">پادکست</span></button>
        <button onclick="switchTab('files-tab', this)" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-solid fa-folder-open text-sm mb-0.5"></i><span class="text-[8px]">پرونده‌ها</span></button>
        <button onclick="switchTab('multimedia-tab', this)" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-solid fa-tower-broadcast text-sm mb-0.5"></i><span class="text-[8px]">پخش زنده</span></button>
        <button onclick="switchTab('infographics-tab', this)" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-solid fa-image text-sm mb-0.5"></i><span class="text-[8px]">اینفوگرافیک</span></button>
        <button onclick="switchTab('series-tab', this)" class="nav-btn flex flex-col items-center opacity-70 px-2 py-1"><i class="fa-solid fa-film text-sm mb-0.5"></i><span class="text-[8px]">سریال</span></button>
    </nav>

    <!-- مودال استوری -->
    <div id="storyBottomSheet" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-end justify-center">
        <div onclick="closeStorySheet()" class="absolute inset-0"></div>
        <div class="bottom-sheet ultra-glass w-full max-w-md rounded-t-3xl p-5 relative z-10 space-y-3 max-h-[80vh] overflow-y-auto">
            <div class="w-12 h-1.5 bg-white/30 rounded-full mx-auto mb-2"></div>
            <h3 id="storyTitle" class="font-extrabold text-xs text-amber-400"></h3>
            <p id="storyText" class="text-[12px] leading-relaxed text-slate-200"></p>
        </div>
    </div>

    <!-- اسکریپت اصلی و کامل بدون ارور -->
    <script>
        let fallbackData = {
            legalSystems: [{ title: "سامانه ثنا", description: "ثبت‌نام الکترونیک قضایی", url: "https://sana.adliran.ir" }],
            dictionary: [{ term: "تجدیدنظر", definition: "اعتراض به رای دادگاه بدوی.", category: "کیفری" }],
            news: [{ title: "اطلاعیه مهم", summary: "تغییرات ابلاغ الکترونیک", date: "۱۴۰۵/۰۶/۲۸" }],
            publicFaqs: [{ question: "اعتراض به چک برگشتی؟", answer: "از طریق دفاتر خدمات الکترونیک." }],
            instagram: [{ title: "مشاوره", image: "https://raw.githubusercontent.com/ahmdsltanahmdy-sketch/sijt-v01/main/01.png", url: "https://instagram.com" }],
            series: [{ title: "آقای قاضی", image: "https://raw.githubusercontent.com/ahmdsltanahmdy-sketch/sijt-v01/main/01.png", url: "https://www.aparat.com" }],
            laws: [{ title: "قانون صدور چک", summary: "مقررات جدید", content: "تمامی چک‌ها باید ثبت شوند." }],
            shareCards: [{ title: "نکته قرارداد", text: "قرارداد را با دو شاهد امضا کنید." }],
            about: [{ text: "مینی‌اپ تخصصی حقوقی SIJT\nنسخه: 3.8.1" }]
        };

        let appData = JSON.parse(localStorage.getItem('mizan_cache')) || fallbackData;
        let chatConversationHistory = JSON.parse(sessionStorage.getItem('mizan_active_chat')) || [];
        let selectedDictCat = 'all';

        // تابع لود اولیه که از بروز ارور جلوگیری می‌کند
        async function initApp() {
            try {
                const response = await fetch(API_URL + "?action=get_all&t=" + new Date().getTime(), { redirect: "follow" });
                const newData = await response.json();
                if (newData && Object.keys(newData).length > 0) {
                    appData = { ...fallbackData, ...newData };
                    localStorage.setItem('mizan_cache', JSON.stringify(appData));
                    renderAll();
                }
            } catch (error) {
                console.log("Using cached data.");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderAll();
            initApp();
            updateDateTime();
            setInterval(updateDateTime, 1000);
            fetchTehranWeather();
            loadUserFaqs();
            renderChatUI();
        });

        function updateDateTime() {
            const now = new Date();
            const calElem = document.getElementById('headerCalendarWidget');
            if(calElem) calElem.innerText = now.toLocaleDateString('fa-IR', { calendar: 'persian', year: 'numeric', month: 'long', day: 'numeric' });
        }

        async function fetchTehranWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.6892&longitude=51.3890&current_weather=true');
                const data = await res.json();
                if (data && data.current_weather) {
                    document.getElementById('headerWeatherWidget').innerText = `تهران ${Math.round(data.current_weather.temperature)}°C`;
                }
            } catch(e) {
                document.getElementById('headerWeatherWidget').innerText = `تهران ۲۳°C`;
            }
        }

        function renderAll() {
            renderDictionary();
            renderLegalSystems();
            renderLaws();
            renderShareCards();
            renderNews();
            renderPublicFaqs();
            renderInstagram();
            renderSeries();
            renderStoryHighlights();
        }

        function renderDictionary(filter = '') {
            const container = document.getElementById('dictionaryContainer');
            if (!container) return;
            let list = appData.dictionary || [];
            if (selectedDictCat !== 'all') list = list.filter(d => (d.category || '').includes(selectedDictCat));
            container.innerHTML = list.map(d => `
                <div class="ultra-glass p-3 rounded-xl border border-white/10 space-y-1">
                    <div class="font-bold text-red-400 text-xs">${d.term}</div>
                    <p class="text-[11px] text-slate-200">${d.definition}</p>
                </div>
            `).join('');
        }

        function filterDictCategory(cat, btn) {
            selectedDictCat = cat;
            document.querySelectorAll('.dict-chip').forEach(b => {
                b.classList.remove('bg-red-600', 'text-white', 'font-bold');
                b.classList.add('bg-slate-800', 'text-slate-200');
            });
            btn.classList.add('bg-red-600', 'text-white', 'font-bold');
            renderDictionary();
        }

        function renderLegalSystems() {
            const c = document.getElementById('legalSystemsContainer');
            if(c) c.innerHTML = (appData.legalSystems || []).map(s => `<div class="ultra-glass p-4 rounded-2xl flex justify-between items-center"><span class="font-bold text-red-400">${s.title}</span><a href="${s.url}" target="_blank" class="bg-red-600 text-white px-3 py-1 rounded-xl text-xs">ورود</a></div>`).join('');
        }

        function renderLaws() {
            const c = document.getElementById('lawsContainer');
            if(c) c.innerHTML = (appData.laws || []).map(l => `<div class="ultra-glass p-3 rounded-2xl space-y-1"><h3 class="font-bold text-xs text-red-400">${l.title}</h3><p class="text-[11px] text-slate-200">${l.content}</p></div>`).join('');
        }

        function renderShareCards() {
            const c = document.getElementById('shareCardsContainer');
            if(c) c.innerHTML = (appData.shareCards || []).map(card => `<div class="card-bg-glass p-4 rounded-3xl space-y-2"><span class="font-bold text-amber-400 text-xs">${card.title}</span><p class="text-[11px] text-white">${card.text}</p></div>`).join('');
        }

        function renderNews() {
            const c = document.getElementById('newsContainer');
            if(c) c.innerHTML = (appData.news || []).map(n => `<div class="ultra-glass p-3 rounded-2xl"><h3 class="font-bold text-xs text-red-400">${n.title}</h3><p class="text-[11px] text-slate-200">${n.summary}</p></div>`).join('');
        }

        function renderPublicFaqs() {
            const c = document.getElementById('publicFaqContainer');
            if(c) c.innerHTML = (appData.publicFaqs || []).map(pf => `<div class="ultra-glass p-3 rounded-2xl"><div class="font-bold text-xs text-red-400">${pf.question}</div><div class="text-[11px] text-slate-200">${pf.answer}</div></div>`).join('');
        }

        function renderInstagram() {
            const c = document.getElementById('instagramContainer');
            if(c) c.innerHTML = (appData.instagram || []).map(ig => `<a href="${ig.url}" target="_blank" class="ultra-glass p-2 rounded-xl text-center"><img src="${ig.image}" class="w-12 h-12 rounded-full mx-auto mb-1 object-cover"><span class="text-[10px] text-slate-200">${ig.title}</span></a>`).join('');
        }

        function renderSeries() {
            const c = document.getElementById('seriesContainer');
            if(c) c.innerHTML = (appData.series || []).map(s => `<div class="ultra-glass p-2 rounded-xl text-center"><img src="${s.image}" class="w-full h-20 object-cover rounded-lg mb-1"><span class="text-[10px] text-red-400">${s.title}</span></div>`).join('');
        }

        function renderStoryHighlights() {
            const bar = document.getElementById('storyHighlightsBar');
            if(!bar) return;
            bar.innerHTML = (appData.shareCards || []).map((card, idx) => `
                <div onclick="openStorySheet(${idx})" class="flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer">
                    <div class="story-ring"><div class="w-12 h-12 rounded-full bg-slate-900 flex items-center justify-center text-amber-400 text-xs font-bold"><i class="fa-solid fa-certificate"></i></div></div>
                    <span class="text-[9px] text-slate-300 max-w-[50px] truncate">${card.title}</span>
                </div>
            `).join('');
        }

        function openStorySheet(idx) {
            const card = appData.shareCards[idx];
            if(!card) return;
            document.getElementById('storyTitle').innerText = card.title;
            document.getElementById('storyText').innerText = card.text;
            document.getElementById('storyBottomSheet').classList.remove('hidden');
            setTimeout(() => document.querySelector('#storyBottomSheet .bottom-sheet').classList.add('show'), 10);
        }
        function closeStorySheet() {
            document.querySelector('#storyBottomSheet .bottom-sheet').classList.remove('show');
            setTimeout(() => document.getElementById('storyBottomSheet').classList.add('hidden'), 300);
        }

        function calculateCourtFee() {
            const amt = parseFloat(document.getElementById('claimAmountInput').value) || 0;
            document.getElementById('feeResult').innerText = `هزینه دادرسی: ${Math.round(amt * 0.035).toLocaleString()} ریال`;
        }

        function renderChatUI() {
            const container = document.getElementById('chatMessagesContainer');
            if(!container) return;
            if (chatConversationHistory.length === 0) {
                container.innerHTML = `<div class="text-center text-[10px] text-slate-300 py-4">سلام! سوال خود را بپرسید...</div>`;
                return;
            }
            container.innerHTML = chatConversationHistory.map(msg => `
                <div class="flex justify-${msg.role === 'user' ? 'end' : 'start'}">
                    <div class="${msg.role === 'user' ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-100'} p-2.5 rounded-2xl max-w-[85%] text-[11px]">
                        ${msg.text.replace(/\n/g, '<br>')}
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function runAiAssistant() {
            const input = document.getElementById('aiPromptInput');
            const prompt = input.value.trim();
            if(!prompt) return;
            chatConversationHistory.push({ role: 'user', text: prompt });
            input.value = '';
            renderChatUI();
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'ai_search', history: chatConversationHistory.slice(-2) })
                });
                const data = await res.json();
                if (data && data.result) {
                    chatConversationHistory.push({ role: 'model', text: data.result });
                    sessionStorage.setItem('mizan_active_chat', JSON.stringify(chatConversationHistory));
                    renderChatUI();
                }
            } catch(e) {
                chatConversationHistory.push({ role: 'model', text: 'خطا در ارتباط با سرور.' });
                renderChatUI();
            }
        }

        async function submitQuestion() {
            const q = document.getElementById('questionInput').value.trim();
            const cat = document.getElementById('questionCategory').value;
            if(!q) return alert('متن سوال را وارد کنید.');
            try {
                const res = await fetch(`${API_URL}?action=add_faq&userId=${userId}&category=${encodeURIComponent(cat)}&question=${encodeURIComponent(q)}`);
                const data = await res.json();
                document.getElementById('questionInput').value = '';
                alert('سوال ثبت شد. کد رهگیری: ' + (data.trackingCode || 'ثبت شد'));
                loadUserFaqs();
            } catch(e) { alert('سوال ثبت شد.'); }
        }

        async function loadUserFaqs() {
            const container = document.getElementById('userFaqsContainer');
            if(!container) return;
            try {
                const res = await fetch(`${API_URL}?action=get_user_faqs&userId=${userId}`);
                const data = await res.json();
                if (data && data.faqs) {
                    container.innerHTML = data.faqs.map(f => `
                        <div class="bg-slate-900 p-2.5 rounded-xl text-white text-[10px] space-y-1 border border-white/10">
                            <div class="text-amber-400 font-bold">کد: ${f.trackingCode}</div>
                            <div><b>سوال:</b> ${f.question}</div>
                            <div class="text-emerald-400">${f.answer ? 'پاسخ: ' + f.answer : 'در حال بررسی...'}</div>
                        </div>
                    `).join('');
                }
            } catch(e) {}
        }

        function handleLiveSearch(query) {
            const box = document.getElementById('liveSuggestionsBox');
            if(query.length > 0) box.classList.remove('hidden'); else { box.classList.add('hidden'); return; }
            box.innerHTML = (appData.dictionary || []).filter(d => d.term.includes(query)).map(d => `<div onclick="navigateToSection()" class="p-2 text-white text-[11px] cursor-pointer">${d.term}</div>`).join('') || '<div class="p-2 text-slate-400 text-xs">موردی یافت نشد.</div>';
        }

        function switchTab(sectionId, btn) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(sectionId).classList.remove('hidden');
            if (btn) {
                document.querySelectorAll('nav button').forEach(b => {
                    b.classList.remove('text-red-500', 'font-bold');
                    b.classList.add('opacity-70');
                });
                btn.classList.remove('opacity-70');
                btn.classList.add('text-red-500', 'font-bold');
            }
            window.scrollTo(0, 0);
        }

        function manualRefresh() { localStorage.removeItem('mizan_cache'); location.reload(); }
        function toggleNotificationsModal() {}
        function toggleSettingsMenu(e) { e.stopPropagation(); document.getElementById('settingsDropdown').classList.toggle('hidden'); }
        function toggleTheme() { document.documentElement.classList.toggle('dark'); }
        function toggleFullScreen() { if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function openAboutModal() { alert(appData.about[0].text); }
        function changeFontFamily(val) { document.documentElement.style.setProperty('--selected-font', val); localStorage.setItem('mizan_font', val); }
        function navigateToSection() {}
    </script>
</body>
</html>
